name: CI

on:
    pull_request:
        types: [opened, synchronize, reopened]

concurrency:
    group: ci-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Cheap detect job: decide whether the heavy `ci` job runs. Needs a checkout
    # only to read .github/path-filters.yml; the PR diff comes from the REST API.
    changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            run: ${{ steps.gate.outputs.run }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v4
              id: f
              with:
                  filters: .github/path-filters.yml
            # Run CI unless every changed file is CI-irrelevant.
            - name: Compute gate
              id: gate
              run: |
                  if [ "${{ steps.f.outputs.all_count }}" != "${{ steps.f.outputs.ci_irrelevant_count }}" ]; then
                      echo "run=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "run=false" >> "$GITHUB_OUTPUT"
                  fi

    ci:
        needs: changes
        if: needs.changes.outputs.run == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - name: Enable Corepack
              run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: yarn

            # 레지스트리 토큰은 install 스텝에만 노출한다(최소 권한). .yarnrc.yml이
            # `${SIGLENS_GITHUB_TOKEN:-}`로 기본값을 두므로 이후 스텝은 토큰 없이 돈다.
            # --mode=skip-build: 시크릿이 있는 동안 패키지 lifecycle 코드를 실행하지 않는다.
            - name: Install dependencies
              env:
                  SIGLENS_GITHUB_TOKEN: ${{ secrets.SIGLENS_GITHUB_TOKEN }}
              run: yarn install --immutable --mode=skip-build

            - name: Type check
              run: yarn typecheck

            - name: Lint
              run: yarn lint

            - name: Format check
              run: yarn format:check

            - name: Test
              run: yarn test

            # pre-push에서 test·build를 뺐으므로 build는 여기서 잡는다.
            - name: Build
              run: yarn build

    # Required-check gate: always runs so a path-skipped `ci` never leaves a
    # required check stuck "pending". Mark THIS job required (not `ci`).
    ci-required:
        needs: [changes, ci]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Verify CI did not fail
              run: |
                  if [ "${{ needs.changes.result }}" = "failure" ] || [ "${{ needs.changes.result }}" = "cancelled" ]; then
                      echo "detect job failed"; exit 1
                  fi
                  if [ "${{ needs.ci.result }}" = "failure" ] || [ "${{ needs.ci.result }}" = "cancelled" ]; then
                      echo "ci failed"; exit 1
                  fi
                  echo "ci ok (result=${{ needs.ci.result }})"
